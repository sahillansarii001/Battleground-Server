<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-color: #080A0C; color: #FFFFFF; }
        .wrapper { background-color: #080A0C; padding: 40px 20px; width: 100%; box-sizing: border-box; }
        .container { max-width: 600px; margin: 0 auto; background-color: #111518; border: 1px solid rgba(255,106,0,0.3); border-top: 4px solid #FF6A00; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 900; color: #FFFFFF; text-transform: uppercase; letter-spacing: 4px; margin: 0; }
        .logo span { color: #FF6A00; }
        h1 { color: #FFFFFF; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; }
        p { color: #B8C0C2; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
        .highlight { color: #FF6A00; font-weight: bold; }
        .data-box { background-color: #080A0C; border: 1px solid rgba(255,255,255,0.1); padding: 20px; margin: 25px 0; border-left: 3px solid #FF6A00; }
        .data-row { margin-bottom: 15px; font-size: 14px; }
        .data-row:last-child { margin-bottom: 0; }
        .data-label { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 5px; }
        .data-value { color: #FFFFFF; font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .btn { display: inline-block; background-color: #FF6A00; color: #000000 !important; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; padding: 14px 30px; font-size: 14px; margin-top: 10px; margin-bottom: 10px; text-align: center; border-radius: 2px; }
        .footer { margin-top: 40px; text-align: center; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <div class="logo">BATTLE<span>GROUNDS</span></div>
            </div>
            <h1>ADMIN CREDENTIAL RESET</h1>
            <p>Admin Level clearance requires identity verification. We received a request to reset your master access code.</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{resetUrl}}" class="btn">RESET ACCESS CODE</a>
        </div>
        <p>If you did not request this, secure your console immediately.</p>
            <div class="footer">
                SYSTEM AUTOMATED TRANSMISSION<br>DO NOT REPLY TO THIS COMM CHANNEL
            </div>
        </div>
    </div>
</body>
</html>
